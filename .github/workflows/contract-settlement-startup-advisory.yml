name: Settlement startup integration verification

# Fork infrastructure only; excluded from the NT contribution branch.
on:
  push:
    branches: [ci/contract-settlement-startup-20260910]

permissions:
  contents: read

jobs:
  tests:
    if: github.repository == 'seungpyoson/nautilus_trader'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: a047513d08229acc5236a0a07a81d12db9ff2b6e
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a047513d08229acc5236a0a07a81d12db9ff2b6e
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Common setup
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.13"
          build-type: test
          free-disk-space: "true"
          rust-cache-key: settlement-startup-integration-advisory

      - name: Affected native components Clippy
        shell: bash
        run: |
          cargo clippy --locked --keep-going --profile ci-pr \
            -p nautilus-live -p nautilus-execution -p nautilus-common \
            -p nautilus-portfolio -p nautilus-polymarket -p nautilus-model \
            -p nautilus-risk -p nautilus-backtest -p nautilus-sandbox \
            --features nautilus-live/node,nautilus-model/high-precision \
            --lib --tests -- -D warnings \
            2>&1 | tee "$RUNNER_TEMP/settlement-startup-clippy.log"

      - name: Affected native components and Polymarket tests
        shell: bash
        run: |
          cargo nextest run --locked --cargo-profile ci-pr --profile ci \
            -p nautilus-live -p nautilus-execution -p nautilus-common \
            -p nautilus-portfolio -p nautilus-polymarket -p nautilus-model \
            -p nautilus-risk -p nautilus-backtest -p nautilus-sandbox \
            --features nautilus-live/node,nautilus-model/high-precision \
            --lib --tests --no-fail-fast \
            2>&1 | tee "$RUNNER_TEMP/settlement-startup-tests.log"

      - name: Prove cleanup regressions reject the old reconciliation code
        shell: bash
        run: |
          git show 684a430f9b3f39fec0193fb5d52d53f660b64d01:crates/live/src/execution/manager.rs \
            > crates/live/src/execution/manager.rs
          set +e
          cargo nextest run --locked --cargo-profile ci-pr --profile ci \
            -p nautilus-live --features node,nautilus-model/high-precision \
            --lib --no-fail-fast \
            -E 'test(contract_settlement_inventory_survives_history_cleanup)' \
            2>&1 | tee "$RUNNER_TEMP/settlement-startup-old-history-control.log"
          control_status=${PIPESTATUS[0]}
          set -e
          git restore --source="$SOURCE_SHA" -- crates/live/src/execution/manager.rs
          echo "Old-history control exit code: $control_status"
          test "$control_status" -eq 100

      - name: Verify final source identity
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: settlement-startup-verification
          path: ${{ runner.temp }}/settlement-startup-*.log
          if-no-files-found: warn
