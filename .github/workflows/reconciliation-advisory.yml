name: Reconciliation application advisory

# Fork infrastructure only; kept outside the source pull request.
on:
  push:
    branches: [ci/reconciliation-application-advisory]

permissions:
  contents: read

jobs:
  tests:
    if: github.repository == 'seungpyoson/nautilus_trader'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      REVIEWED_SHA: 431a2fd752eeeda41e69643e0d5d37bb6037b800
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 431a2fd752eeeda41e69643e0d5d37bb6037b800
          persist-credentials: false

      - name: Verify reviewed commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"

      - name: Common setup
        id: setup
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.13"
          build-type: test
          free-disk-space: "true"
          rust-cache-key: reconciliation-application-ci-pr

      - name: Execution engine tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: >-
          cargo nextest run --locked --cargo-profile ci-pr --profile ci
          -p nautilus-execution --lib --tests --no-fail-fast

      - name: Live reconciliation and lifecycle tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: >-
          cargo nextest run --locked --cargo-profile ci-pr --profile ci
          -p nautilus-live --lib --tests --no-fail-fast

      - name: Common and Polymarket collection tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: >-
          cargo nextest run --locked --cargo-profile ci-pr --profile ci
          -p nautilus-common -p nautilus-polymarket --lib --tests --no-fail-fast

      - name: Account risk backtest and sandbox consumers
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: >-
          cargo nextest run --locked --cargo-profile ci-pr --profile ci
          -p nautilus-portfolio -p nautilus-risk -p nautilus-backtest -p nautilus-sandbox
          --lib --tests --no-fail-fast

      - name: Model report serialization including Python dictionary roundtrip
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: >-
          cargo nextest run --locked --cargo-profile ci-pr --profile ci
          -p nautilus-model --features python --lib
          -E 'test(reports::mass_status::)' --no-fail-fast

      - name: Affected native components Clippy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: >-
          cargo clippy --locked --profile ci-pr
          -p nautilus-model -p nautilus-common -p nautilus-execution
          -p nautilus-live -p nautilus-polymarket -p nautilus-portfolio
          -p nautilus-risk -p nautilus-backtest -p nautilus-sandbox
          --features nautilus-model/python --lib --tests -- -D warnings

      - name: Standalone live runner Clippy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: >-
          cargo clippy --locked --profile ci-pr -p nautilus-live
          --no-default-features --lib -- -D warnings

      - name: Verify source remained unchanged
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          git diff --exit-code
          git diff --cached --exit-code
