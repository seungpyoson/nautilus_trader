name: Reconciliation application advisory

# Fork infrastructure only; kept outside the source pull request.
on:
  push:
    branches: [ci/reconciliation-application-advisory]

permissions:
  contents: read

jobs:
  tests:
    if: github.repository == 'seungpyoson/nautilus_trader'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      REVIEWED_SHA: 72f47ee7c30583323cec5154a8af1f51c7eaf45e
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 72f47ee7c30583323cec5154a8af1f51c7eaf45e
          persist-credentials: false

      - name: Verify reviewed commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"

      - name: Common setup
        id: setup
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.13"
          build-type: test
          free-disk-space: "true"
          rust-cache-key: reconciliation-application-ci-pr

      # Check native construction and snapshots, retaining the unresolved correction diagnostics.
      - name: Native position construction and affected consumer tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo nextest run --locked --cargo-profile ci-pr --profile ci \
            -p nautilus-model -p nautilus-common -p nautilus-execution -p nautilus-event-store \
            -p nautilus-portfolio -p nautilus-system -p nautilus-live -p nautilus-backtest \
            --lib --tests --no-fail-fast \
            2>&1 | tee "$RUNNER_TEMP/native-position-construction.log"

      - name: Preserve affected suite output
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-position-construction-${{ env.REVIEWED_SHA }}
          path: ${{ runner.temp }}/native-position-construction.log
          if-no-files-found: error

      - name: Affected library and test Clippy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: cargo clippy --locked --profile ci-pr -p nautilus-model -p nautilus-common -p nautilus-execution -p nautilus-event-store -p nautilus-portfolio -p nautilus-system -p nautilus-live -p nautilus-backtest --lib --tests -- -D warnings

      - name: Standalone live library Clippy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: cargo clippy --locked --profile ci-pr -p nautilus-live --no-default-features --lib -- -D warnings

      - name: Verify source remained unchanged
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          git diff --exit-code
          git diff --cached --exit-code
