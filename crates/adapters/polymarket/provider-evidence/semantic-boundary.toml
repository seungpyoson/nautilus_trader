[[routes]]
id = "post_order"
method = "POST"
path = "/order"
statuses = ["live", "matched", "delayed", "unmatched"]

[[routes]]
id = "get_exact_order"
method = "GET"
path = "/data/order/{order_id}"
statuses = [
  "ORDER_STATUS_LIVE",
  "ORDER_STATUS_INVALID",
  "ORDER_STATUS_CANCELED_MARKET_RESOLVED",
  "ORDER_STATUS_CANCELED",
  "ORDER_STATUS_MATCHED",
]

[[routes]]
id = "get_associated_trades"
method = "GET"
path = "/data/trades"
statuses = ["MATCHED", "MINED", "CONFIRMED", "RETRYING", "FAILED"]

